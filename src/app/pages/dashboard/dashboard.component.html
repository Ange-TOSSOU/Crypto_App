<div style="background-color: #F9FAFB;">

    <app-header></app-header>
    <div class="w-full px-6">
        <div class="flex w-full items-center overflow-hidden cryptos-list py-2">
            <ng-container *ngFor="let item of cryptosTrending">
                <div class="flex items-center gap-2">
                    <app-crypto-card [crypto]="item" class="h-fit"></app-crypto-card>
                    <span class="mr-2" style="color: #CCCCCC">|</span>
                </div>
            </ng-container>
        </div>
    </div>
    <div class="py-3 px-6">
        <div class="title mb-2">
            <span class="text-xs">Bitcoin</span>
            <div class="flex items-center justify-between">
                <div class="flex gap-1">
                    <p class="font-bold text-2xl"> {{79000 | currency}} </p>
                    <div class="px-2 rounded-xs flex items-center" style="background-color: #75F7C7;">
                        <span style="color: #16D496;">5%</span>
                    </div>
                </div>
                <div class="period-selector">
                    <ng-container *ngFor="let item of timePeriods">
                        <button class="period px-4 py-1 cursor-pointer" [style.color]="'#CCCCCC'"
                            [style.backgroundColor]="item.value !== activePeriod ? '#F5F5F5': ''"
                            (click)="changePeriod(item.value)"
                            > {{item.label}}
                        </button>
                    </ng-container>

                </div>
            </div>
        </div>
        <div class="w-full flex gap-5">
            <div class="w-3/4 p-3 bg-white" style="border: 1px solid #CCCC;">
                <app-graphe [chartData]="historyData"></app-graphe>
            </div>
            <div class="w-1/4 bg-white" style="border: 1px solid #CCCC;">

            </div>
        </div>
    </div>
    <div class="px-6 w-3/4">
        <app-top-cryptos></app-top-cryptos>
    </div>
</div>
