<div style="background-color: #F9FAFB;">

    <app-header></app-header>
    <div class="w-full px-6 overflow-hidden relative pause-on-hover border-b border-[#e9e9e9]">

        <div class="flex w-max items-center animate-marquee py-1">
            <ng-container *ngFor="let item of infiniteCryptos">
                <div class="flex items-center gap-2 cursor-pointer" [title]="item.name"
                    (click)="selectTrendingCrypto(item)">
                    <app-crypto-card [crypto]="item"></app-crypto-card>
                    <span class="mr-2 text-gray-300">|</span>
                </div>
            </ng-container>

        </div>
    </div>
    <div class="py-3 px-6">
        <div class="title mb-2">
            <span class="text-xs"> {{currentCryptoDetails.name}} </span>
            <div class="flex items-center justify-between">
                <div class="flex gap-1">
                    <p class="font-bold text-2xl"> {{currentCryptoDetails.currentPrice | currency: 'EUR'}} </p>
                    <div class="px-2 rounded-xs flex items-center"
                        [style.backgroundColor]="currentCryptoDetails.change24h > 0 ? '#75F7C7': '#f8a8a8'">
                        <span [style.color]="currentCryptoDetails.change24h > 0 ? '#16D496': '#FF6B6B' ">
                            {{currentCryptoDetails.change24h | number: '1.2-2'}}% </span>
                    </div>
                </div>
                <div class="period-selector">
                    <ng-container *ngFor="let item of timePeriods">
                        <button class="period px-4 py-1 cursor-pointer" [title]="item.title" [style.color]="'#CCCCCC'"
                            [style.backgroundColor]="item.value !== activePeriod ? '#F5F5F5': ''"
                            (click)="changePeriod(item.value)"> {{item.label}}
                        </button>
                    </ng-container>

                </div>
            </div>
        </div>
        <div class="w-full flex gap-5">
            <div class="w-3/4  h-fit gap-2 flex flex-col">
                <div class="bg-white p-3" style="border: 1px solid #CCCC;">
                    <app-graphe [chartData]="historyData"></app-graphe>
                </div>
                <app-top-cryptos></app-top-cryptos>
            </div>
            <div class="w-1/4 bg-white h-fit" style="border: 1px solid #CCCC;">
                <app-trade [crypto]="cryptoToTradeInfos"></app-trade>
                <app-trade-history [trades]="trades" ></app-trade-history>
            </div>
        </div>
    </div>
    <div class="px-6 w-3/4">
    </div>
</div>
