<div class="flex justify-between items-center p-2 header bg-white relative shadow-sm z-40">
    
    <div class="flex-1 flex justify-start px-6">
        <a href="/" class="cursor-pointer">
            <img src="assets/logo/logo-coinverse.png" width="128" height="128" priority alt="Coinverse">
        </a>
    </div>

    <div class="flex-1 flex justify-center">
        <div (click)="openSearch()" 
             class="flex items-center gap-3 cursor-pointer bg-gray-100 hover:bg-gray-200 transition px-4 py-2 rounded-full w-full max-w-md text-gray-500">
            
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
            <span class="text-sm font-medium">Rechercher une crypto...</span>
        </div>
    </div>

    <div class="flex-1 flex justify-end items-center gap-4 px-6">
        <button (click)="openProfile()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#6EB1F7" class="size-10 cursor-pointer hover:opacity-80 transition">
                <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>
</div>

<div *ngIf="isSearchOpen" class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    
    <div (click)="closeSearch()" class="fixed inset-0 bg-black/60 transition-opacity backdrop-blur-sm"></div>

    <div class="flex min-h-full items-start justify-center p-4 text-center sm:p-0 mt-20 relative z-10">
        
        <div class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
            
            <div class="bg-white p-4 border-b border-gray-100 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6 text-gray-400">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
                
                <input 
                    type="text" 
                    [(ngModel)]="searchQuery"
                    (ngModelChange)="onSearchChange()"
                    class="w-full text-lg outline-none placeholder-gray-400 text-gray-900" 
                    placeholder="Rechercher Bitcoin, Ethereum..."
                    autofocus
                >

                <div *ngIf="isLoading" class="animate-spin rounded-full h-5 w-5 border-2 border-gray-200 border-t-blue-500"></div>
                
                <button *ngIf="!isLoading && searchQuery" (click)="searchQuery=''; onSearchChange()" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="px-2 py-2 bg-gray-50 h-[300px] overflow-y-auto">
                
                <div *ngIf="!searchQuery" class="text-center text-gray-500 py-8">
                    <p class="text-sm mb-4">Cryptos populaires</p>
                    <div class="flex gap-2 justify-center flex-wrap">
                        <button (click)="searchQuery='Bitcoin'; onSearchChange()" class="px-3 py-1 bg-white border border-gray-200 rounded-full text-xs font-medium text-gray-600 hover:border-blue-400 hover:text-blue-500 transition">
                            Bitcoin
                        </button>
                        <button (click)="searchQuery='Ethereum'; onSearchChange()" class="px-3 py-1 bg-white border border-gray-200 rounded-full text-xs font-medium text-gray-600 hover:border-blue-400 hover:text-blue-500 transition">
                            Ethereum
                        </button>
                        <button (click)="searchQuery='Solana'; onSearchChange()" class="px-3 py-1 bg-white border border-gray-200 rounded-full text-xs font-medium text-gray-600 hover:border-blue-400 hover:text-blue-500 transition">
                            Solana
                        </button>
                    </div>
                </div>

                <div *ngIf="searchQuery && searchResults.length > 0" class="space-y-1">
                    <div *ngFor="let coin of searchResults" 
                         (click)="selectCrypto(coin.id)"
                         class="p-2 hover:bg-white hover:shadow-sm rounded-lg cursor-pointer flex items-center justify-between transition group">
                        
                        <div class="flex items-center gap-3">
                            <img [src]="coin.thumb" class="w-8 h-8 rounded-full bg-white shadow-sm" alt="logo">
                            <div class="flex flex-col text-left">
                                <span class="font-bold text-gray-800 text-sm group-hover:text-blue-600 transition">{{ coin.name }}</span>
                                <span class="text-xs text-gray-500 font-medium">{{ coin.symbol }}</span>
                            </div>
                        </div>
                        
                        <span class="text-[10px] font-bold text-gray-400 bg-gray-200 px-2 py-0.5 rounded">
                            #{{ coin.market_cap_rank || '?' }}
                        </span>
                    </div>
                </div>

                <div *ngIf="searchQuery && !isLoading && searchResults.length === 0" class="text-center py-10 text-gray-400">
                    <p>Aucun résultat pour "{{ searchQuery }}"</p>
                </div>

            </div>
        </div>
    </div>
</div>

<div *ngIf="isProfileOpen" class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <div (click)="closeProfile()" class="fixed inset-0 bg-black/75 transition-opacity backdrop-blur-sm"></div>
    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-6 relative z-10">
        <div class="relative transform overflow-hidden rounded-3xl bg-white text-left shadow-2xl transition-all w-full max-w-5xl">
            <app-profile></app-profile>
            <button (click)="closeProfile()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-800 transition-colors bg-gray-100 rounded-full p-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</div>
