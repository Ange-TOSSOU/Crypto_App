<div class="flex justify-between items-center p-2 header bg-white relative">
    
    <div class="flex-1 flex justify-start px-6">
        <a href="/">
            <img src="assets/logo/logo-coinverse.png" width="128" height="128" priority>
        </a>
    </div>

    <div class="flex-1 flex justify-center">
        <div (click)="openSearch()" 
             class="flex items-center gap-3 cursor-pointer bg-gray-100 hover:bg-gray-200 transition px-4 py-2 rounded-full w-full max-w-md text-gray-500">
            
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
            <span class="text-sm font-medium">Rechercher une crypto...</span>
            
        </div>
    </div>

    <div class="flex-1 flex justify-end items-center gap-4 px-6">
        
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 cursor-pointer text-gray-600 hover:text-gray-900 transition">
            <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0 1 13.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 0 1-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 1 1-7.48 0 24.585 24.585 0 0 1-4.831-1.244.75.75 0 0 1-.298-1.205A8.217 8.217 0 0 0 5.25 9.75V9Zm4.502 8.9a2.25 2.25 0 1 0 4.496 0 25.057 25.057 0 0 1-4.496 0Z" clip-rule="evenodd" />
        </svg>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#6EB1F7" class="size-7 cursor-pointer hover:opacity-80 transition">
            <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
        </svg>

        <button (click)="openProfile()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#6EB1F7" class="size-10 cursor-pointer hover:opacity-80 transition">
                <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>
</div>

<div *ngIf="isSearchOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    
    <div (click)="closeSearch()" class="fixed inset-0 bg-black/75 transition-opacity backdrop-blur-sm"></div>

    <div class="flex min-h-full items-start justify-center p-4 text-center sm:p-0 mt-20">
        
        <div class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
            
            <div class="bg-white p-4 border-b border-gray-100 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6 text-gray-400">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
                <input 
                    type="text" 
                    [(ngModel)]="searchQuery"
                    class="w-full text-lg outline-none placeholder-gray-400 text-gray-900" 
                    placeholder="Rechercher Bitcoin, Ethereum..."
                    autofocus
                >
            </div>

            <div class="px-4 py-6 bg-gray-50 h-64 overflow-y-auto">
                
                <div *ngIf="!searchQuery" class="text-center text-gray-500 py-8">
                    <p class="text-sm">Commencez à taper pour rechercher...</p>
                    <div class="mt-4 flex gap-2 justify-center flex-wrap">
                        <span class="px-3 py-1 bg-white border rounded-full text-xs text-gray-600 cursor-pointer hover:border-blue-400">Bitcoin</span>
                        <span class="px-3 py-1 bg-white border rounded-full text-xs text-gray-600 cursor-pointer hover:border-blue-400">Ethereum</span>
                        <span class="px-3 py-1 bg-white border rounded-full text-xs text-gray-600 cursor-pointer hover:border-blue-400">Solana</span>
                    </div>
                </div>

                <div *ngIf="searchQuery" class="space-y-2">
                    <div class="p-2 hover:bg-white hover:shadow-sm rounded cursor-pointer flex items-center justify-between transition">
                        <span class="font-medium text-gray-800">Bitcoin (BTC)</span>
                        <span class="text-gray-500 text-sm">77,504 €</span>
                    </div>
                    </div>

            </div>
        </div>
    </div>
</div>

<div *ngIf="isProfileOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    
    <div (click)="closeProfile()" class="fixed inset-0 bg-black/75 transition-opacity backdrop-blur-sm"></div>

    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-6">
        
        <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:w-full sm:max-w-5xl">
            
            <div class="bg-white">
                <app-profile></app-profile>
            </div>

            <button (click)="closeProfile()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>
</div>
