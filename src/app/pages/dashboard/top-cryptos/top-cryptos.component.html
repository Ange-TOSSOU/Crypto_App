<div class="bg-white w-full rounded-2xl shadow-sm border border-gray-100 flex flex-col h-full overflow-hidden">
    
    <div class="px-6 py-4 border-b border-gray-100 bg-white z-10">
        <span class="font-bold text-lg text-gray-800">Marché (Top 50)</span>
    </div>

    <div class="overflow-y-auto h-[500px] custom-scrollbar px-3">
        <table class="w-full text-sm text-left">
            
            <thead class="text-xs text-gray-400 uppercase bg-gray-50 sticky top-0 z-10 shadow-sm">
                <tr>
                    <th class="px-6 py-3 font-medium">Crypto</th>
                    <th class="px-4 py-3 font-medium text-right">Prix</th>
                    <th class="px-4 py-3 font-medium text-center">24h</th>
                    <th class="px-4 py-3 font-medium text-right hidden md:table-cell">Vol. 24h</th>
                    <th class="px-4 py-3 font-medium text-right hidden lg:table-cell">Cap. Marché</th>
                    <th class="px-4 py-3 font-medium text-center">7j</th>
                </tr>
            </thead>

            <tbody class="divide-y divide-gray-50">
                <tr *ngFor="let item of cryptos" 
                    (click)="onRowClick(item)"
                    class="hover:bg-blue-50/50 transition-colors cursor-pointer group">
                    
                    <td class="px-6 py-3">
                        <div class="flex items-center gap-3">
                            <img [src]="item.logo" [alt]="item.name" class="w-6 h-6 rounded-full">
                            <div class="flex flex-col">
                                <span class="font-bold text-gray-700 group-hover:text-blue-600 transition">{{item.name}}</span>
                                <span class="text-xs text-gray-400 font-medium">{{item.symbol}}</span>
                            </div>
                        </div>
                    </td>

                    <td class="px-4 py-3 font-medium text-gray-700 text-right">
                        {{item.price | currency:'EUR':'symbol':'1.2-2'}}
                    </td>

                    <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 rounded-md text-xs font-bold"
                            [ngClass]="item.change24h >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'">
                            {{ item.change24h >= 0 ? '+' : '' }}{{ item.change24h | number:'1.2-2' }}%
                        </span>
                    </td>

                    <td class="px-4 py-3 text-gray-500 text-right hidden md:table-cell">
                        {{item.volume | shortNumber}} €
                    </td>

                    <td class="px-4 py-3 text-gray-500 text-right hidden lg:table-cell">
                        {{item.marketCap | shortNumber}} €
                    </td>

                    <td class="px-4 py-3 text-center text-xs">
                        <span *ngIf="item.change7d > 0" class="text-green-500 bg-green-50 p-1 rounded">📈 Hausse</span>
                        <span *ngIf="item.change7d < 0" class="text-red-500 bg-red-50 p-1 rounded">📉 Baisse</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
