<div class="flex items-center gap-7 py-1">
    <div class="flex items-center gap-2">
        <img [src]="crypto.logo" width="24" height="24" priority>
        <span class="font-bold whitespace-nowrap"> {{crypto.name}} </span>
    </div>

    <div class="flex items-center gap-1">
        <span style="color: #CCCCCC; font-weight: 600;"> {{crypto.price | currency:'USD':'symbol':'1.0-2' }} </span>

        <div class="flex items-center">

            <ng-container *ngIf="crypto.change24h && crypto.change24h >= 0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#16D496" class="size-4">
                    <path fill-rule="evenodd" d="M11.47 7.72a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 1 1-1.06 1.06L12 9.31l-6.97 6.97a.75.75 0 0 1-1.06-1.06l7.5-7.5Z" clip-rule="evenodd" />
                </svg>
                <span style="color: #16D496;" class="font-bold"> {{crypto.change24h}} </span>
            </ng-container>

            <ng-container *ngIf="crypto.change24h && crypto.change24h < 0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#FF6B6B" class="size-4">
                    <path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 0 1 1.06-1.06L12 14.69l6.97-6.97a.75.75 0 1 1 1.06 1.06l-7.5 7.5Z" clip-rule="evenodd" />
                </svg>
                <span style="color: #FF6B6B;" class="font-bold"> {{crypto.change24h}} </span>
            </ng-container>

        </div>
    </div>
</div>
